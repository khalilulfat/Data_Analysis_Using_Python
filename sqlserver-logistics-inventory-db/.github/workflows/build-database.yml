name: Build database on SQL Server 2022

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SA_PASSWORD: "Ci_Only_Str0ng!Pass"
    steps:
      - uses: actions/checkout@v4

      - name: Start SQL Server 2022 (Developer edition, container)
        run: |
          docker run -d --name sql -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD="$SA_PASSWORD" -e MSSQL_PID=Developer \
            -p 1433:1433 mcr.microsoft.com/mssql/server:2022-latest
          for i in $(seq 1 60); do
            if docker exec sql /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$SA_PASSWORD" -Q "SELECT 1" >/dev/null 2>&1; then
              echo "SQL Server is ready"; exit 0
            fi
            sleep 3
          done
          echo "SQL Server did not start"; docker logs sql; exit 1

      - name: Run the complete build script
        run: |
          docker cp VerdantStackDB_Complete.sql sql:/tmp/build.sql
          # -b: stop with a non-zero exit code on any uncaught error   -I: QUOTED_IDENTIFIER ON
          docker exec sql /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$SA_PASSWORD" -b -I -i /tmp/build.sql
